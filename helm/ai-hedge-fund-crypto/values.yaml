# Default values for ai-hedge-fund-crypto.
# This is a YAML-formatted file.

replicaCount: 1

image:
  repository: ai-hedge-fund-crypto
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Application configuration
config:
  mode: backtest  # backtest, live
  startDate: "2025-04-20"
  endDate: "2025-05-01"
  primaryInterval: "1h"
  initialCash: 100000
  marginRequirement: 0.0
  showReasoning: false
  showAgentGraph: false
  signals:
    intervals: ["30m", "1h", "4h"]
    tickers: ["BTCUSDT", "ETHUSDT"]
    strategies: ["MacdStrategy"]
  model:
    name: "gpt-4o-mini"
    provider: "openai"
    # baseUrl: "https://api.openai.com/v1"

# Secret configuration
secrets:
  # Binance API credentials
  binanceApiKey: ""
  binanceApiSecret: ""
  # LLM API keys
  openaiApiKey: ""
  groqApiKey: ""
  openrouterApiKey: ""
  anthropicApiKey: ""
  googleApiKey: ""

# Persistence configuration
persistence:
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi