apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-hedge-fund-crypto.fullname" . }}
  labels:
    {{- include "ai-hedge-fund-crypto.labels" . | nindent 4 }}
type: Opaque
data:
  binance-api-key: {{ .Values.secrets.binanceApiKey | b64enc | quote }}
  binance-api-secret: {{ .Values.secrets.binanceApiSecret | b64enc | quote }}
  openai-api-key: {{ .Values.secrets.openaiApiKey | b64enc | quote }}
  groq-api-key: {{ .Values.secrets.groqApiKey | b64enc | quote }}
  openrouter-api-key: {{ .Values.secrets.openrouterApiKey | b64enc | quote }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | b64enc | quote }}
  google-api-key: {{ .Values.secrets.googleApiKey | b64enc | quote }}